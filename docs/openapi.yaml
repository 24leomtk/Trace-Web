# TRACE Mobile / Integration API (N4 pilot) — OpenAPI 3.1
#
# Human-readable contract for /api/v1. Success: 200 raw JSON (actions
# returning nothing give { ok: true }). Errors: non-2xx { error }.
# Auth: session cookie (web), `Authorization: Bearer <token>` (Expo), or
# `X-API-Key: trace_…` / `?api_key=trace_…` on key-enabled routes (pilot:
# GET /lookups/plate, scope plate:read). See docs/mobile-api.md for the
# field-level guide and docs/mobile-api-types.ts for client types.

openapi: 3.1.0
info:
  title: TRACE API
  version: 1.0.0
  description: >-
    Shared digital records for law enforcement (regular + traffic domains,
    courts, insurers, vehicle registry). Same authorization, validation,
    and audit as the web app.
servers:
  - url: https://<your-deployment>/api/v1
  - url: http://localhost:3000/api/v1

security:
  - cookieAuth: []
  - bearerAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token (Expo) — converted server-side.
    machineKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        trace_… machine key (admin-issued, scoped). Pilot scope: plate:read
        on GET /lookups/plate. Also accepted as ?api_key=.
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    RecordType:
      type: string
      enum: [missing_person, wanted_person, stolen_property, crime_incident,
        arrest_record, missing_vehicle, vehicle_offense, road_accident,
        traffic_citation, vehicle_impoundment]
    CaseStatus:
      type: string
      enum: [active, resolved, closed, archived]
    FeedScope:
      type: string
      enum: [all, mine, district, country]
    PlateLookupResult:
      type: object
      required: [flagged, reasons]
      properties:
        flagged: { type: boolean }
        reasons:
          type: array
          items: { type: string }
          description: Active case classes (police callers; [] for insurers).

paths:
  /health:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200": { description: OK }

  /me:
    get:
      summary: Signed-in profile (role, scope)
      responses:
        "200": { description: Profile }
        "401": { description: Sign in again, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    delete:
      summary: Self-service deactivation
      responses:
        "200": { description: "{ ok: true }" }

  /records:
    get:
      summary: Paginated case feed (own scope)
      parameters:
        - { name: cursor, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/RecordType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CaseStatus' } }
        - { name: scope, in: query, schema: { $ref: '#/components/schemas/FeedScope', default: all } }
      responses:
        "200": { description: "{ items, nextCursor }" }
    post:
      summary: File a case in the caller's domain
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, format: uuid }, description: Offline-safe retries replay the original response. }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: { $ref: '#/components/schemas/RecordType' }
                data: { type: object, description: Typed payload per recordSchemas }
                accessLevel: { type: string, enum: [branch, district, country], default: branch }
                branchId: { type: string, format: uuid, description: Monitors only }
      responses:
        "200": { description: "{ id } (+ idempotentReplay on replay)" }
        "422": { description: Validation issues }

  /records/{id}:
    get:
      summary: Single case (visibility-gated; liaisons via live referral)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: TraceRecord }
        "403": { description: Out of scope }
        "404": { description: Unknown record }
    patch:
      summary: Edit an active case payload (filer / in-scope monitor)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: object }
      responses:
        "200": { description: "{ ok: true }" }

  /records/{id}/status:
    get:
      summary: Status transition hints (monitors)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ current, hints }" }
    post:
      summary: Change case status (monitors; reason required off active)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/CaseStatus' }
                reason: { type: string }
      responses:
        "200": { description: "{ ok: true }" }

  /records/{id}/access:
    post:
      summary: Access mutations (access-level / reassign / link-person)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ ok: true }" }

  /records/{id}/attachments:
    post:
      summary: Append files to an active case
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ ok: true }" }

  /records/{id}/reviews:
    get:
      summary: Follow-up notes thread
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ items }" }
    post:
      summary: Add a review note
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ id }" }

  /records/{id}/assignments:
    get:
      summary: Everyone tasked on one case
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ items }" }

  /records/{id}/matches:
    get:
      summary: Live matches or link candidates (?view=matches|candidates)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: view, in: query, schema: { type: string, enum: [matches, candidates], default: matches } }
      responses:
        "200": { description: "{ items }" }

  /records/{id}/custody:
    get:
      summary: Custody card state (impoundments)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: CustodyState }
    post:
      summary: Custody transitions (hold / release / owner-notice)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ ok: true }" }

  /records/{id}/locate:
    get:
      summary: Locate card state
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: LocateState }
    post:
      summary: Locate transitions (report / confirm / disposition)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ ok: true }" }

  /records/{id}/citation:
    get:
      summary: Fine ledger for one citation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: CitationLedger }

  /records/{id}/referrals:
    get:
      summary: Live court grants on one case (monitors)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ items }" }

  /records/{id}/audit:
    get:
      summary: Per-record activity trail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ items }" }

  /search:
    get:
      summary: Unified lookup (vehicles + persons + citations)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        "200": { description: "{ vehicles, persons, citations }" }

  /persons:
    get:
      summary: Person-profile search
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        "200": { description: "{ items }" }
    post:
      summary: Create a person profile
      responses:
        "200": { description: "{ id }" }

  /persons/{id}:
    get:
      summary: Person profile detail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Person detail }

  /vehicles/search:
    get:
      summary: Vehicle search by plate
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        "200": { description: "{ items }" }

  /vehicles/{id}:
    get:
      summary: Vehicle detail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Vehicle detail }

  /assignments:
    get:
      summary: My task queue (?view=mine) or assignable users (?view=assignable)
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [mine, assignable], default: mine } }
      responses:
        "200": { description: "{ open, recent } or { items }" }
    post:
      summary: Assign a case (monitors)
      responses:
        "200": { description: "{ id }" }

  /assignments/{id}:
    post:
      summary: Complete or cancel a task
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ ok: true }" }

  /matches:
    post:
      summary: Propose a record link
      responses:
        "200": { description: "{ id }" }

  /matches/review:
    post:
      summary: Confirm / exclude a proposed match (monitors)
      responses:
        "200": { description: "{ ok: true }" }

  /referrals:
    get:
      summary: Liaison referrals (?view=mine|outcomes)
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [mine, outcomes] } }
      responses:
        "200": { description: "{ items }" }
    post:
      summary: Refer a case to court (monitors)
      responses:
        "200": { description: "{ id }" }

  /referrals/{id}:
    post:
      summary: Renew / revoke (monitors) or record outcome (liaison)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ ok: true }" }

  /court-liaisons:
    get:
      summary: Referral target picker (monitors)
      responses:
        "200": { description: "{ items }" }

  /citations/payments:
    post:
      summary: Record a fine payment
      responses:
        "200": { description: "{ receiptNo, balance, isPaid }" }

  /citations/void:
    post:
      summary: Void a ticket (monitors)
      responses:
        "200": { description: "{ ok: true }" }

  /citations/court-schedule:
    post:
      summary: Schedule a court appearance (monitors)
      responses:
        "200": { description: "{ ok: true }" }

  /citations/search:
    get:
      summary: Ticket / violation / plate search
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        "200": { description: "{ items }" }

  /citations/lookup:
    get:
      summary: Resolve a ticket number
      parameters:
        - { name: ticket, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ recordId, balance, isPaid }" }

  /courts:
    get:
      summary: Court picker (police)
      responses:
        "200": { description: "{ items }" }

  /reconciliation/summary:
    get:
      summary: Daily money reconciliation (monitors)
      responses:
        "200": { description: ReconciliationSummary }

  /locates/dormant:
    get:
      summary: Locates awaiting confirmation (monitors)
      responses:
        "200": { description: "{ items }" }

  /watchlist/flagged:
    get:
      summary: Flagged plates in scope (police)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: "{ items }" }

  /audit/log:
    get:
      summary: Scoped audit trail
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: "{ items }" }

  /catalog/record-types:
    get:
      summary: Filing type picker
      parameters:
        - { name: domain, in: query, schema: { type: string, enum: [regular, traffic] } }
      responses:
        "200": { description: "{ items }" }

  /catalog/branches:
    get:
      summary: Filing branch picker
      parameters:
        - { name: domain, in: query, required: true, schema: { type: string, enum: [regular, traffic] } }
      responses:
        "200": { description: "{ items }" }

  /notifications/{id}:
    delete:
      summary: Dismiss one notification
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ ok: true }" }

  /me/phone:
    post:
      summary: Number-change helpers (check / sync)
      responses:
        "200": { description: "{ ok: true }" }

  /lookups:
    post:
      summary: Safety lookups (audited, throttled)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [check, nationalId]
                  properties: { check: { const: wanted }, nationalId: { type: string } }
                - type: object
                  required: [check, plateNumber]
                  properties: { check: { const: plate }, plateNumber: { type: string } }
      responses:
        "200": { description: WantedCheckResult or FlagCheckResult }
        "403": { description: Slow down (rate limit) or wrong role }

  /lookups/plate:
    get:
      summary: ANPR-ready plate check
      security:
        - cookieAuth: []
        - bearerAuth: []
        - machineKey: []
      parameters:
        - { name: plate, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Flag + reasons
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlateLookupResult' }

  /notifications:
    get:
      summary: "{ unread, items }"
      responses:
        "200": { description: Inbox }
    post:
      summary: "Mark read ({ id } for one, { all: true } for all)"
      responses:
        "200": { description: "{ ok: true }" }

  /analytics/feed:
    get:
      summary: Scoped analytics cards (monitors; audited as report_generated)
      responses:
        "200": { description: AnalyticsEntry[] }
        "403": { description: Monitors only }

  /uploads/credentials:
    get:
      summary: Short-lived Cloudinary signing material (filing roles)
      responses:
        "200": { description: UploadCredentials }
